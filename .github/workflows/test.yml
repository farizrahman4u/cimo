# The test suite on every push and pull request: Linux arm64 (gcc as the reference compiler,
# with the corpora) and Windows arm64 (clang from Visual Studio as the reference).
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest numpy
      - name: fetch the corpora (gcc torture, c-testsuite, libc-test)
        run: python tests/corpora.py
      - run: python -m pytest -q

  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: arm64
      - run: pip install pytest numpy
      - name: fetch the corpora
        run: python tests/corpora.py
      - run: python -X utf8 -m pytest -q
