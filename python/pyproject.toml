[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cimo"
version = "0.0.5"
description = "A C compiler written in pure Python: C kernels in, machine code out."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fariz Rahman" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Software Development :: Compilers",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
cimo = "cimo.cli:main"

[project.optional-dependencies]
dev = ["pytest", "black", "isort", "numpy", "mypy"]

[project.urls]
Homepage = "https://github.com/farizrahman4u/cimo"

[tool.setuptools.packages.find]
include = ["cimo*"]

[tool.setuptools.package-data]
"*" = ["*.md", "py.typed", "include/*.h", "runtime/COPYRIGHT", "runtime/symbols.txt", "frontend/LICENSE", "backend/LICENSE", "runtime/*.c", "runtime/*/*.c",
       "runtime/*/*.h", "gpu/include/cimo/*.h", "gpu/lib/*.c", "gpu/host/*.c"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# the user-facing API is typed (compile, load, Module, kernels, the errors); the ported
# compiler internals are not yet, so imports into them are followed silently
files = ["cimo/__init__.py", "cimo/driver.py", "cimo/execution.py"]
python_version = "3.10"  # the oldest mypy checks; the code also runs on 3.9
follow_imports = "silent"
warn_unused_ignores = true
